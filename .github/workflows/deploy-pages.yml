name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for the Pages deployment to authenticate.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a newer commit win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Work out the base path
        id: base
        # A project site is served from /<repo>/, but a user site
        # (<user>.github.io) and any custom domain are served from the root.
        # Getting this wrong makes every asset 404, so it is computed rather
        # than hardcoded.
        run: |
          repo="${{ github.event.repository.name }}"
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ] || [ "$repo" = "${{ github.repository_owner }}.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
          # Set this repository variable to your deployed API URL
          # (Settings -> Secrets and variables -> Actions -> Variables).
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Attach the custom domain
        # Pages needs a CNAME file in the published output to serve a custom
        # domain. Set the CUSTOM_DOMAIN repository variable to enable it.
        if: vars.CUSTOM_DOMAIN != ''
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME

      - name: Add SPA 404 fallback
        # GitHub Pages has no rewrite rules; serving the shell as 404.html
        # makes deep links work instead of showing Pages' own 404.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on (with Actions as the source) via the API, so the
          # repository does not have to be configured by hand first.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
